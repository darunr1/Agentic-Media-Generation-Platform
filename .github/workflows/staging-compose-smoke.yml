name: Staging Compose smoke
on:
  pull_request:
    paths:
      - docker-compose.staging.yml
      - scripts/staging-smoke.sh
      - .github/workflows/staging-compose-smoke.yml
      - infra/docker/**
      - packages/shared/src/env.ts
      - packages/shared/src/email.ts
  push:
    branches: [main]
    paths:
      - docker-compose.staging.yml
      - scripts/staging-smoke.sh
      - .github/workflows/staging-compose-smoke.yml
      - infra/docker/**
      - packages/shared/src/env.ts
      - packages/shared/src/email.ts
permissions:
  contents: read
jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable smoke-test environment
        run: |
          umask 077
          {
            echo "STAGING_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "APP_URL=https://staging.sequence.test"
            echo "RESEND_API_KEY=ci-test-not-a-live-key"
            echo "EMAIL_FROM=login@sequence.test"
          } > .env.staging.local
      - name: Validate and start staging stack
        run: |
          docker compose --env-file .env.staging.local -f docker-compose.staging.yml config --quiet
          docker compose --env-file .env.staging.local -f docker-compose.staging.yml up -d --build
      - name: Verify health, private ports and shared media
        run: bash scripts/staging-smoke.sh
      - name: Report service status
        if: always()
        run: docker compose --env-file .env.staging.local -f docker-compose.staging.yml ps -a
      - name: Tear down disposable CI stack
        if: always()
        run: docker compose --env-file .env.staging.local -f docker-compose.staging.yml down --volumes
