name: contentforge

# Complete local stack. No paid provider or cloud account is required.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contentforge
      POSTGRES_PASSWORD: contentforge
      POSTGRES_DB: contentforge_dev
    ports:
      - "5432:5432"
    volumes:
      - contentforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentforge -d contentforge_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://contentforge:contentforge@postgres:5432/contentforge_dev?schema=public
      LOCAL_STORAGE_DIR: /data
      QUEUE_PROVIDER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - contentforge_media:/data
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://contentforge:contentforge@postgres:5432/contentforge_dev?schema=public
      LOCAL_STORAGE_DIR: /data
      QUEUE_PROVIDER: postgres
      WORKER_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - contentforge_media:/data
    ports:
      - "3001:3001"

  renderer:
    build:
      context: .
      dockerfile: infra/docker/renderer.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://contentforge:contentforge@postgres:5432/contentforge_dev?schema=public
      QUEUE_PROVIDER: postgres
      RENDERER_PORT: 3002
      LOCAL_STORAGE_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - contentforge_media:/data
    ports:
      - "3002:3002"

volumes:
  contentforge_postgres_data:
  contentforge_media:
